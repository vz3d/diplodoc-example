<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Имя Фамилия — веб-разработчик</title>
    <style>
        /* Сброс стилей и базовые настройки */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a; /* тёмно-синий фон */
            color: #e2e8f0; /* светло-серый текст */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        /* Карточка-визитка */
        .card {
            max-width: 600px;
            width: 100%;
            background: #1e293b; /* чуть светлее фона */
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            text-align: center;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Аватар (замените ссылку) */
        .avatar {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8; /* яркий акцент */
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #f8fafc;
        }

        .subhead {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .subhead span {
            color: #38bdf8;
            font-weight: 500;
        }

        .description {
            font-size: 1rem;
            color: #cbd5e1;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        /* Контакты — иконки + ссылки */
        .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px 24px;
            margin-top: 10px;
        }

        .links a {
            color: #e2e8f0;
            text-decoration: none;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 40px;
            background: #334155;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .links a:hover {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            transform: scale(1.05);
        }

        /* Простые иконки через Unicode */
        .icon {
            font-size: 1.2rem;
            line-height: 1;
        }

        /* Подвал */
        .footer {
            margin-top: 35px;
            font-size: 0.85rem;
            color: #64748b;
            border-top: 1px solid #334155;
            padding-top: 20px;
        }

        /* Адаптив для маленьких экранов */
        @media (max-width: 480px) {
            .card {
                padding: 25px 18px;
            }
            h1 {
                font-size: 1.7rem;
            }
            .links a {
                padding: 6px 14px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <!-- ЗАМЕНИТЕ ССЫЛКУ НА ВАШЕ ФОТО -->
    <img src="https://i.pravatar.cc/300?img=11" alt="Аватар" class="avatar">

    <h1>Алексей Иванов</h1>
    <div class="subhead">
        <span>✦</span> Frontend-разработчик <span>✦</span>
    </div>

    <p class="description">
        Создаю быстрые и красивые веб-интерфейсы. 
        Люблю минимализм, порядок и отзывчивый дизайн. 
        Доступен для сотрудничества и новых проектов.
    </p>

    <div class="links">
        <a href="mailto:your@email.com">
            <span class="icon">✉</span> Почта
        </a>
        <a href="https://t.me/your_nick" target="_blank">
            <span class="icon">✈</span> Telegram
        </a>
        <a href="https://github.com/your_nick" target="_blank">
            <span class="icon">⌨</span> GitHub
        </a>
        <a href="#" target="_blank">
            <span class="icon">💼</span> LinkedIn
        </a>
    </div>

    <div class="footer">
        © 2026 • Москва • работаю удалённо
    </div>
</div>

</body>
        </html>
